<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO Robot</title>
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--card:#0f3460;--accent:#e94560;--accent2:#533483;--text:#eee;--text-dim:#999;--green:#00b894;--yellow:#fdcb6e;--red:#e17055;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;height:100vh;width:100vw}
#ball{position:fixed;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;cursor:grab;z-index:9999;box-shadow:0 4px 20px rgba(233,69,96,.5);font-size:28px;top:80px;right:40px}
#ball:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(233,69,96,.7)}
#ball:active{cursor:grabbing}
#ball .badge{position:absolute;top:-4px;right:-4px;background:var(--green);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
#ball .pulse{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:pulse 2s infinite;pointer-events:none}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.8);opacity:0}}
#panel{position:fixed;top:50px;right:20px;width:440px;max-height:88vh;background:var(--bg2);border-radius:var(--radius);z-index:9998;box-shadow:0 8px 40px rgba(0,0,0,.4);display:none;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
#panel.open{display:flex;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.panel-header{padding:14px 18px;background:var(--card);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06)}
.panel-header h1{font-size:16px;font-weight:600}
.panel-header .date{font-size:12px;color:var(--text-dim);margin-top:2px}
.header-actions{display:flex;gap:8px}
.icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:8px;transition:all .2s}
.icon-btn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.tabs{display:flex;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.06)}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:13px;cursor:pointer;color:var(--text-dim);border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-content{flex:1;overflow-y:auto;padding:12px}
.tab-content::-webkit-scrollbar{width:6px}
.tab-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.todo-item{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;transition:background .2s;cursor:pointer;position:relative}
.todo-item:hover{background:rgba(255,255,255,.08)}
.todo-item.done .todo-title{text-decoration:line-through;color:var(--text-dim)}
.todo-checkbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--text-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;margin-top:1px}
.todo-checkbox.checked{background:var(--green);border-color:var(--green)}
.todo-checkbox.checked::after{content:"\2713";color:#fff;font-size:13px;font-weight:700}
.todo-body{flex:1;min-width:0}
.todo-title{font-size:13px;line-height:1.5;word-break:break-word}
.todo-meta{font-size:11px;color:var(--text-dim);margin-top:3px;display:flex;gap:8px;align-items:center}
.priority-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-high{background:var(--red)}.p-medium{background:var(--yellow)}.p-low{background:var(--green)}.p-none{background:var(--text-dim);opacity:.4}
.add-bar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.add-bar input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none}
.add-bar input:focus{border-color:var(--accent)}
.add-bar select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px;color:var(--text);font-size:12px;outline:none}
.add-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;transition:opacity .2s}
.add-btn:hover{opacity:.85}
.sync-bar{padding:8px 12px;background:rgba(255,255,255,.03);display:flex;gap:8px;border-top:1px solid rgba(255,255,255,.06)}
.sync-btn{flex:1;background:rgba(83,52,131,.5);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;transition:all .2s}
.sync-btn:hover{background:var(--accent2)}
.sync-btn:disabled{opacity:.5;cursor:wait}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:10001;display:none;transition:opacity .3s}
#toast.show{display:block}
.loading{text-align:center;padding:30px;color:var(--text-dim);font-size:13px}
.empty{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:13px}
.section-label{font-size:11px;color:var(--text-dim);padding:8px 4px 4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-top:1px solid rgba(255,255,255,.06);margin-top:4px}
.section-label:first-child{border-top:none;margin-top:0}
.todo-actions{display:none;gap:4px}
.todo-item:hover .todo-actions{display:flex}
.todo-actions button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px}
.todo-actions button:hover{color:var(--accent)}
.cal-item{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--accent2)}
.cal-time{font-size:13px;font-weight:600;color:var(--accent)}
.cal-title{font-size:13px;margin-top:3px}
.cal-loc{font-size:11px;color:var(--text-dim);margin-top:2px}
.doc-item{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:10px}
.doc-item:hover{background:rgba(255,255,255,.08)}
.doc-icon{font-size:20px}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:13px;font-weight:500}
.doc-path{font-size:11px;color:var(--text-dim);margin-top:2px}
.process-btn{width:100%;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;margin-bottom:10px;transition:opacity .2s}
.process-btn:hover{opacity:.9}
.process-btn:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<div id="ball">
  <span>&#129302;</span>
  <div class="pulse"></div>
  <div class="badge" id="todoBadge" style="display:none">0</div>
</div>
<div id="panel">
  <div class="panel-header">
    <div>
      <h1>&#128203; TODO Robot <span style="font-size:10px;color:var(--text-dim);font-weight:400">v4.0</span></h1>
      <div class="date" id="dateStr"></div>
      <div id="apiStatus" style="font-size:10px;color:var(--text-dim);margin-top:2px"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="refresh()" title="刷新">&#128260;</button>
      <button class="icon-btn" onclick="togglePanel()" title="收起">&#10005;</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('todos')" id="tab-todos">&#128221; 待办</div>
    <div class="tab" onclick="switchTab('calendar')" id="tab-calendar">&#128197; 日程</div>
    <div class="tab" onclick="switchTab('docs')" id="tab-docs">&#128196; 文档</div>
    <div class="tab" onclick="switchTab('okr')" id="tab-okr">&#127919; OKR</div>
    <div class="tab" onclick="switchTab('dm')" id="tab-dm">&#128172; 消息</div>
  </div>
  <div class="tab-content" id="content-todos">
    <div class="add-bar">
      <input type="text" id="newTodo" placeholder="输入待办标题，回车添加..." onkeypress="if(event.key==='Enter')smartAdd()">
      <select id="newPriority">
        <option value="none">普通</option>
        <option value="low">&#128994; 低</option>
        <option value="medium">&#128992; 中</option>
        <option value="high">&#128308; 高</option>
      </select>
      <button class="add-btn" onclick="smartAdd()">+</button>
    </div>
    <div id="todoList"></div>
  </div>
  <div class="tab-content" id="content-calendar" style="display:none"><div id="calList"></div></div>
  <div class="tab-content" id="content-docs" style="display:none"><div id="docList"></div></div>
  <div class="tab-content" id="content-okr" style="display:none"><div id="okrList"></div></div>
  <div class="tab-content" id="content-dm" style="display:none"><div id="dmList"></div></div>
  <div class="sync-bar">
    <button class="sync-btn" onclick="syncDaily()" id="syncDailyBtn">&#128229; 同步到日报</button>
    <button class="sync-btn" onclick="syncWeekly()" id="syncWeeklyBtn">&#128229; 同步到周报</button>
  </div>
</div>
<div id="toast"></div>
<script>
"use strict";
console.log("[TODO Robot v4.0] Script starting...");

function esc(s){
  s = String(s == null ? "" : s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

var state = {
  todos: [], localTodos: [], calendar: [],
  dailyDocs: [], weeklyDocs: [], okrDocs: [],
  docTodos: [], docDrafts: [], docId: null, okrTodos: [], weeklyTodos: [], dmOthers: [], groupAtMe: []
};

async function api(url, method, body){
  method = method || "GET";
  var opts = {method: method, headers: {"Content-Type":"application/json"}};
  if(body) opts.body = JSON.stringify(body);
  var res = await fetch(url, opts);
  return res.json();
}

function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(function(){ el.classList.remove("show"); }, 2500);
}

function togglePanel(){
  console.log("[TODO Robot] togglePanel called");
  var p = document.getElementById("panel");
  if(p.classList.contains("open")){
    p.classList.remove("open");
  } else {
    p.classList.add("open");
    refresh();
  }
}

function switchTab(tab){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
  document.querySelectorAll(".tab-content").forEach(function(c){c.style.display="none";});
  document.getElementById("tab-"+tab).classList.add("active");
  document.getElementById("content-"+tab).style.display="block";
}

async function refresh(){
  console.log("[TODO Robot] refresh called");
  document.getElementById("todoList").innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById("calList").innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById("docList").innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById("okrList").innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById("dmList").innerHTML = '<div class="loading">加载中...</div>';
  try{
    document.getElementById("apiStatus").textContent = "正在加载...";
    var res = await api("/api/summary");
    if(!res.ok){
      document.getElementById("apiStatus").textContent = "API错误";
      document.getElementById("todoList").innerHTML = '<div class="empty">加载失败</div>';
      return;
    }
    var d = res.data;
    state.todos = d.todos || [];
    state.localTodos = d.local_todos || [];
    state.docTodos = d.doc_todos || [];
    state.docDrafts = d.doc_drafts || [];
    state.docId = d.daily_doc_id || null;
    state.calendar = d.calendar || [];
    state.dailyDocs = d.daily_docs || [];
    state.weeklyDocs = d.weekly_docs || [];
    state.okrDocs = d.okr_docs || [];

    // Load weekly and OKR local data from summary response
    state.weeklyTodos = d.weekly_todos || [];
    state.okrTodos = d.okr_todos || [];
    var dmData = d.dm_messages || {};
    state.dmOthers = dmData.dm_others || [];
    state.groupAtMe = dmData.group_atme || [];

    document.getElementById("dateStr").textContent = d.today + " · 第" + d.week + "周";
    var active = (state.localTodos||[]).filter(function(t){return !t.completed;}).length
      + (state.todos||[]).filter(function(t){return !t.completed;}).length
      + (state.docTodos||[]).filter(function(t){return !t.completed;}).length;
    var badge = document.getElementById("todoBadge");
    badge.textContent = active;
    badge.style.display = active > 0 ? "flex" : "none";
    document.getElementById("apiStatus").textContent = "本地 " + (state.localTodos||[]).length + " + D-Chat " + (state.todos||[]).length + " 项";
    renderTodos();
    renderCalendar();
    renderDocs();
    renderOKR();
    renderDM();
  }catch(err){
    console.error("refresh error:", err);
    document.getElementById("todoList").innerHTML = '<div class="empty">加载错误: ' + esc(err.message) + "</div>";
  }
}

function renderTodos(){
  var list = document.getElementById("todoList");
  var html = "";
  // Local todos
  html += '<div class="section-label">今日待办 (本地存储)</div>';
  if(state.localTodos && state.localTodos.length > 0){
    var sorted = state.localTodos.slice().sort(function(a,b){
      if(a.completed !== b.completed) return a.completed ? 1 : -1;
      var po = {high:0,medium:1,low:2,none:3};
      return (po[a.priority]||3) - (po[b.priority]||3);
    });
    sorted.forEach(function(t){
      var priDot = {high:"p-high",medium:"p-medium",low:"p-low",none:"p-none"}[t.priority] || "p-none";
      html += '<div class="todo-item '+(t.completed?"done":"")+'">'
        + '<div class="todo-checkbox '+(t.completed?"checked":"")+'" onclick="toggleLocalTodo('+t.id+','+t.completed+')"></div>'
        + '<div class="todo-body" ondblclick="openEditLocalTodo('+t.id+')">'
        + '<div class="todo-title">'+esc(t.title)+'</div>'
        + '<div class="todo-meta"><span class="priority-dot '+priDot+'"></span>'
        + (t.progress ? '<span>'+esc(t.progress)+'</span>' : '')
        + '<span>'+(t.completed?"已完成":"未完成")+'</span></div></div>'
        + '<div class="todo-actions">'
        + '<button onclick="openEditLocalTodo('+t.id+')" title="编辑">E</button>'
        + '<button onclick="deleteLocalTodo('+t.id+')" title="删除">X</button>'
        + '</div></div>';
    });
    html += '<button class="process-btn" onclick="syncLocalToCooper()">同步到 Cooper 日报</button>';
  } else {
    html += '<div class="empty" style="padding:16px 8px;font-size:12px">暂无本地待办，在上方输入框添加</div>';
  }

  // D-Chat todos
  if(state.todos && state.todos.length > 0){
    html += '<div class="section-label">D-Chat 待办</div>';
    state.todos.forEach(function(t){
      var priDot = {high:"p-high",medium:"p-medium",low:"p-low",none:"p-none"}[t.priority] || "p-none";
      html += '<div class="todo-item '+(t.completed?"done":"")+'">'
        + '<div class="todo-checkbox '+(t.completed?"checked":"")+'" onclick="toggleTodo('+t.id+','+t.completed+')"></div>'
        + '<div class="todo-body"><div class="todo-title">'+esc(t.title)+'</div>'
        + '<div class="todo-meta"><span class="priority-dot '+priDot+'"></span>'
        + (t.due_time_str ? '<span>'+esc(t.due_time_str)+'</span>' : '')
        + '<span>'+(t.origin||"")+'</span></div></div></div>';
    });
  }

  if(!html) html = '<div class="empty">暂无待办</div>';
  list.innerHTML = html;
}

function renderCalendar(){
  var list = document.getElementById("calList");
  if(!state.calendar || state.calendar.length === 0){
    list.innerHTML = '<div class="empty">今日暂无日程</div>';
    return;
  }
  var html = "";
  state.calendar.forEach(function(e){
    html += '<div class="cal-item">'
      + '<div class="cal-time">'+esc(e.start_str)+" - "+esc(e.end_str)+'</div>'
      + '<div class="cal-title">'+esc(e.title)+'</div>'
      + (e.location ? '<div class="cal-loc">'+esc(e.location)+'</div>' : '')
      + '</div>';
  });
  list.innerHTML = html;
}

function renderDocs(){
  var list = document.getElementById("docList");
  var docs = (state.dailyDocs||[]).concat(state.weeklyDocs||[]);
  if(docs.length === 0){
    list.innerHTML = '<div class="empty">暂无日报/周报文档</div>';
    return;
  }
  var html = "";
  docs.forEach(function(d){
    var icon = (d.name && d.name.indexOf("周报")>=0) ? "W" : "D";
    html += '<div class="doc-item" data-doc-id="'+d.id+'" data-doc-name="'+esc(d.name)+'">'
      + '<span class="doc-icon">'+icon+'</span>'
      + '<div class="doc-info"><div class="doc-name">'+esc(d.name)+'</div>'
      + '<div class="doc-path">'+esc(d.path||"")+' · '+esc(d.type||"")+'</div></div></div>';
  });
  list.innerHTML = html;
  list.querySelectorAll(".doc-item").forEach(function(el){
    el.addEventListener("click", function(){
      openDoc(this.getAttribute("data-doc-id"), this.getAttribute("data-doc-name"));
    });
  });
}

function renderOKR(){
  var list = document.getElementById("okrList");
  // Show OKR local todos if available, otherwise show OKR docs
  if(state.okrTodos && state.okrTodos.length > 0){
    var html = '<div class="section-label">季度 OKR</div>';
    state.okrTodos.forEach(function(t){
      var priDot = {high:"p-high",medium:"p-medium",low:"p-low",none:"p-none"}[t.priority] || "p-none";
      html += '<div class="todo-item '+(t.completed?"done":"")+'">'
        + '<div class="todo-checkbox '+(t.completed?"checked":"")+'"></div>'
        + '<div class="todo-body"><div class="todo-title">'+esc(t.title)+'</div>'
        + '<div class="todo-meta"><span class="priority-dot '+priDot+'"></span>'
        + (t.progress ? '<span>'+esc(t.progress)+'</span>' : '')
        + '<span>'+esc(t.status||"")+'</span></div></div></div>';
    });
    list.innerHTML = html;
    return;
  }
  if(state.okrDocs && state.okrDocs.length > 0){
    var html2 = "";
    state.okrDocs.forEach(function(d){
      html2 += '<div class="doc-item" data-doc-id="'+d.id+'" data-doc-name="'+esc(d.name)+'">'
        + '<span class="doc-icon">O</span>'
        + '<div class="doc-info"><div class="doc-name">'+esc(d.name)+'</div>'
        + '<div class="doc-path">'+esc(d.path||"")+'</div></div></div>';
    });
    list.innerHTML = html2;
    list.querySelectorAll(".doc-item").forEach(function(el){
      el.addEventListener("click", function(){
        openDoc(this.getAttribute("data-doc-id"), this.getAttribute("data-doc-name"));
      });
    });
    return;
  }
  list.innerHTML = '<div class="empty">暂无OKR数据</div>';
}

function renderDM(){
  var list = document.getElementById("dmList");
  var html = "";
  var hasContent = false;

  // Group messages by author (chat_name for DM, chat_name for group)
  function groupByAuthor(msgs){
    var groups = {};
    var order = [];
    msgs.forEach(function(m, idx){
      var key = m.author || m.chat_name || "未知";
      if(!groups[key]){
        groups[key] = {author: m.author, chat_name: m.chat_name, msgs: []};
        order.push(key);
      }
      groups[key].msgs.push({m: m, idx: idx});
    });
    return order.map(function(k){ return groups[k]; });
  }

  // === 私聊：对方发来的消息 ===
  if(state.dmOthers && state.dmOthers.length > 0){
    hasContent = true;
    html += '<div class="section-label">私聊消息 <span style="float:right;font-weight:400;text-transform:none">对方发来 · 点击 + 转为待办</span></div>';
    var dmGroups = groupByAuthor(state.dmOthers);
    dmGroups.forEach(function(g){
      var msgs = g.msgs;
      var latestTime = "";
      msgs.forEach(function(mi){
        var t = mi.m.created_at ? mi.m.created_at.substring(11, 16) : "";
        if(t > latestTime) latestTime = t;
      });
      html += '<div class="cal-item">'
        + '<div class="cal-time">' + esc(latestTime) + ' · ' + esc(g.author) + ' <span style="color:var(--text-dim);font-size:11px">(' + msgs.length + '条)</span></div>';
      msgs.forEach(function(mi){
        var timeStr = mi.m.created_at ? mi.m.created_at.substring(11, 16) : "";
        html += '<div class="cal-title" style="margin-top:6px;padding-left:8px;border-left:2px solid rgba(255,255,255,.1)">' + esc(mi.m.text) + '</div>'
          + '<div style="display:flex;align-items:center;gap:8px;margin-top:2px;padding-left:8px">'
          + '<span style="font-size:10px;color:var(--text-dim)">' + esc(timeStr) + '</span>'
          + '<button class="process-btn" style="margin:0;width:auto;padding:2px 8px;font-size:11px" onclick="dmToTodo(0,' + mi.idx + ')">+ 转为待办</button>'
          + '</div>';
      });
      html += '</div>';
    });
  }

  // === 群聊：@我的消息 ===
  if(state.groupAtMe && state.groupAtMe.length > 0){
    hasContent = true;
    html += '<div class="section-label">群聊 @我 <span style="float:right;font-weight:400;text-transform:none">需要关注 · 点击 + 转为待办</span></div>';
    var grpGroups = groupByAuthor(state.groupAtMe);
    grpGroups.forEach(function(g){
      var msgs = g.msgs;
      var latestTime = "";
      msgs.forEach(function(mi){
        var t = mi.m.created_at ? mi.m.created_at.substring(11, 16) : "";
        if(t > latestTime) latestTime = t;
      });
      html += '<div class="cal-item" style="border-left-color:var(--accent)">'
        + '<div class="cal-time">' + esc(latestTime) + ' · ' + esc(g.author) + ' <span style="color:var(--text-dim);font-size:11px">群: ' + esc(g.chat_name) + ' (' + msgs.length + '条)</span></div>';
      msgs.forEach(function(mi){
        var timeStr = mi.m.created_at ? mi.m.created_at.substring(11, 16) : "";
        html += '<div class="cal-title" style="margin-top:6px;padding-left:8px;border-left:2px solid rgba(233,69,96,.2)">' + esc(mi.m.text) + '</div>'
          + '<div style="display:flex;align-items:center;gap:8px;margin-top:2px;padding-left:8px">'
          + '<span style="font-size:10px;color:var(--text-dim)">' + esc(timeStr) + '</span>'
          + '<button class="process-btn" style="margin:0;width:auto;padding:2px 8px;font-size:11px" onclick="dmToTodo(1,' + mi.idx + ')">+ 转为待办</button>'
          + '</div>';
      });
      html += '</div>';
    });
  }

  if(!hasContent){
    list.innerHTML = '<div class="empty">暂无需要关注的消息</div>';
  } else {
    list.innerHTML = html;
  }
}

async function dmToTodo(type, idx){
  var m = (type === 0) ? state.dmOthers[idx] : state.groupAtMe[idx];
  if(!m) return;
  var title = m.text;
  if(title.length > 80) title = title.substring(0, 80) + "...";
  var source = (type === 0) ? ("私聊来自 " + m.author) : ("群聊 " + m.chat_name + " @我 " + m.author);
  var res = await api("/api/local/todos/create","POST",{title:title,priority:"medium",progress:source});
  if(res.ok){ toast("已从消息创建待办"); refresh(); }
  else toast("创建失败");
}

// Local todo management
async function addLocalTodo(){
  var input = document.getElementById("newTodo");
  var priority = document.getElementById("newPriority").value;
  var title = input.value.trim();
  if(!title) return;
  var res = await api("/api/local/todos/create","POST",{title:title,priority:priority});
  if(res.ok){ input.value=""; toast("已添加本地待办"); refresh(); }
  else toast("添加失败");
}

async function toggleLocalTodo(id, completed){
  var res = await api("/api/local/todos/toggle","POST",{id:id,completed:!completed});
  if(res.ok){ toast(completed?"已恢复":"已完成"); refresh(); }
  else toast("操作失败");
}

async function deleteLocalTodo(id){
  if(!confirm("确定删除此待办?")) return;
  var res = await api("/api/local/todos/delete","POST",{id:id});
  if(res.ok){ toast("已删除"); refresh(); }
  else toast("删除失败");
}

function openEditLocalTodo(id){
  var t = state.localTodos.find(function(x){return x.id == id;});
  if(!t) return;
  var newTitle = prompt("编辑待办标题:", t.title);
  if(newTitle === null) return;
  if(!newTitle.trim()){ toast("标题不能为空"); return; }
  var newProgress = prompt("进度说明:", t.progress || "");
  if(newProgress === null) return;
  updateLocalTodoApi(id, newTitle.trim(), newProgress);
}

async function updateLocalTodoApi(id, title, progress){
  var res = await api("/api/local/todos/update","POST",{id:id,title:title,progress:progress});
  if(res.ok){ toast("已更新"); refresh(); }
  else toast("更新失败");
}

async function syncLocalToCooper(){
  var btn = event.target;
  btn.disabled = true; btn.textContent = "同步中...";
  var res = await api("/api/local/sync","POST");
  btn.disabled = false; btn.textContent = "同步到 Cooper 日报";
  if(res.ok){
    toast("已同步 " + (res.data.synced||0) + "/" + (res.data.total||0) + " 条待办");
    refresh();
  } else toast("同步失败");
}

async function openDoc(id, name){
  var modal = document.createElement("div");
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px";
  modal.innerHTML = '<div style="background:var(--bg2);border-radius:16px;max-width:680px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden"><div style="padding:14px 18px;background:var(--card);display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:15px">'+esc(name)+'</h1><button class="icon-btn" id="closeDocModalBtn">X</button></div><div id="docModalBody" style="padding:18px;overflow-y:auto;font-size:13px;line-height:1.7;white-space:pre-wrap">加载中...</div></div>';
  document.body.appendChild(modal);
  modal.querySelector("#closeDocModalBtn").onclick = function(){ modal.remove(); };
  modal.onclick = function(e){ if(e.target===modal) modal.remove(); };
  var res = await api("/api/docs/content?id="+id);
  if(res.ok){
    var content = res.data || "";
    modal.querySelector("#docModalBody").textContent = content.replace(/<!--[\s\S]*?-->/g,"").trim();
  } else {
    modal.querySelector("#docModalBody").textContent = "加载失败";
  }
}

// Drag + click for floating ball
var dragging = false, dragMoved = false, startX = 0, startY = 0, offsetX = 0, offsetY = 0;
var ball = document.getElementById("ball");
ball.addEventListener("mousedown", function(e){
  dragging = true; dragMoved = false;
  startX = e.clientX; startY = e.clientY;
  offsetX = e.clientX - ball.offsetLeft;
  offsetY = e.clientY - ball.offsetTop;
});
document.addEventListener("mousemove", function(e){
  if(!dragging) return;
  if(Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5){
    dragMoved = true;
    ball.style.left = (e.clientX - offsetX) + "px";
    ball.style.top = (e.clientY - offsetY) + "px";
    ball.style.right = "auto";
  }
});
document.addEventListener("mouseup", function(){ dragging = false; });
ball.addEventListener("click", function(e){
  console.log("[TODO Robot] ball clicked, dragMoved="+dragMoved);
  if(!dragMoved){ togglePanel(); }
});
